<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Style Product Listing Outline</title>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <h1>Flipkart</h1>
        </div>

        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" placeholder="Search for products, brands and more">
            <button>Search</button>
        </div>

        <!-- Navigation -->
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Categories</a></li>
                <li><a href="#">Offers</a></li>
                <li><a href="#">Cart</a></li>
                <li><a href="#">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- Category Sidebar -->
        <aside>
            <h2>Categories</h2>
            <ul>
                <li>Electronics</li>
                <li>Fashion</li>
                <li>Home & Furniture</li>
                <li>Mobiles</li>
                <li>Appliances</li>
            </ul>
        </aside>

        <!-- Product Grid -->
        <section class="product-grid">

            <article class="product-card">
                <img src="product.jpg" alt="Product">
                <h3>Product Name</h3>
                <p>₹999</p>
                <button>Add to Cart</button>
            </article>

            <article class="product-card">
                <img src="product.jpg" alt="Product">
                <h3>Product Name</h3>
                <p>₹1499</p>
                <button>Add to Cart</button>
            </article>

            <article class="product-card">
                <img src="product.jpg" alt="Product">
                <h3>Product Name</h3>
                <p>₹1999</p>
                <button>Add to Cart</button>
            </article>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Flipkart Clone. All Rights Reserved.</p>
    </footer>

</body>
</html>
