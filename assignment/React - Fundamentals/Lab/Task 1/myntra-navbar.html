<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myntra Responsive Navbar</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

nav{
    background:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    box-shadow:0 2px 5px rgba(0,0,0,0.15);
    flex-wrap:wrap;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#ff3f6c;
}

.search{
    flex:1;
    text-align:center;
}

.search input{
    width:60%;
    padding:8px;
}

.links{
    display:flex;
    list-style:none;
}

.links li{
    margin-left:20px;
}

.links a{
    text-decoration:none;
    color:#333;
    font-weight:bold;
}

.menu-toggle{
    display:none;
    font-size:28px;
    cursor:pointer;
}

@media(max-width:768px){

.search{
    width:100%;
    margin:15px 0;
}

.search input{
    width:100%;
}

.menu-toggle{
    display:block;
}

.links{
    width:100%;
    display:flex;
    flex-direction:column;
    text-align:center;
}

.links li{
    margin:12px 0;
}

}

</style>
</head>

<body>

<nav>

<div class="logo">Myntra</div>

<div class="menu-toggle">&#9776;</div>

<div class="search">
<input type="text" placeholder="Search products...">
</div>

<ul class="links">
<li><a href="#">Home</a></li>
<li><a href="#">Explore</a></li>
<li><a href="#">Cart</a></li>
<li><a href="#">Profile</a></li>
</ul>

</nav>

</body>
</html>
